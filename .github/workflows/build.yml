name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Public GitHub Release URL for the uploaded project ZIP
        required: true
        type: string
      app_name:
        description: APK filename without extension
        required: true
        type: string
      user_id:
        description: Telegram user ID
        required: true
        type: string
      upload_tag:
        description: Temporary ZIP release tag to delete after build
        required: false
        type: string
        default: ""
      flutter_version:
        description: Flutter version (stable or an exact version such as 3.29.3)
        required: false
        type: string
        default: stable

run-name: build-${{ inputs.user_id }}-${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Download ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          curl --fail --location --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-filesize 314572800 \
            "$ZIP_URL" -o project.zip
          ls -lah project.zip
          test -s project.zip

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir -p _proj
          unzip -q project.zip -d _proj
          PUB="$(find _proj -maxdepth 5 -name pubspec.yaml -type f -print -quit)"
          if [ -z "$PUB" ]; then
            echo "::error::ZIP tidak berisi pubspec.yaml di kedalaman yang didukung"
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: |
          set -euo pipefail
          cd "$PROJ_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          set -euo pipefail
          cd "$PROJ_DIR"
          flutter build apk --release

      - name: Prepare APK
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          mkdir -p output
          SAFE_NAME="$(printf '%s' "$APP_NAME" | tr -cd '[:alnum:]_.-' | cut -c1-80)"
          [ -n "$SAFE_NAME" ] || SAFE_NAME="app"
          cp "$PROJ_DIR/build/app/outputs/flutter-apk/app-release.apk" "output/${SAFE_NAME}.apk"
          echo "APK_NAME=${SAFE_NAME}.apk" >> "$GITHUB_ENV"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.user_id }}-${{ github.run_number }}
          name: "${{ inputs.app_name }} #${{ github.run_number }}"
          files: output/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temporary ZIP release
        if: ${{ always() && inputs.upload_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPLOAD_TAG: ${{ inputs.upload_tag }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          RELEASE_ID="$(curl --silent --show-error --fail \\
            -H "Authorization: Bearer $GH_TOKEN" \\
            -H "Accept: application/vnd.github+json" \\
            "$API/releases/tags/$UPLOAD_TAG" | jq -r '.id // empty' || true)"
          if [ -n "$RELEASE_ID" ]; then
            curl --silent --show-error --fail-with-body -X DELETE \\
              -H "Authorization: Bearer $GH_TOKEN" \\
              -H "Accept: application/vnd.github+json" \\
              "$API/releases/$RELEASE_ID" || true
          fi
          curl --silent --show-error --fail-with-body -X DELETE \\
            -H "Authorization: Bearer $GH_TOKEN" \\
            -H "Accept: application/vnd.github+json" \\
            "$API/git/refs/tags/$UPLOAD_TAG" || true
