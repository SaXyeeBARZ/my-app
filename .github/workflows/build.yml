name: Build Flutter Project

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Public download URL of the uploaded project ZIP
        required: true
        type: string
      app_name:
        description: Output filename without extension
        required: true
        type: string
      user_id:
        description: Telegram user ID
        required: true
        type: string
      upload_tag:
        description: Temporary upload release tag to remove after build
        required: false
        type: string
        default: ""
      build_mode:
        description: Build mode
        required: true
        type: choice
        options: [release, debug, analyze]
        default: release
      flutter_version:
        description: stable or exact Flutter version
        required: false
        type: string
        default: stable

run-name: web2apk-${{ inputs.build_mode }}-${{ inputs.user_id }}-${{ github.run_number }}

permissions:
  contents: write

concurrency:
  group: web2apk-${{ inputs.user_id }}-${{ github.run_number }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter stable
        if: ${{ inputs.flutter_version == '' || inputs.flutter_version == 'stable' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup selected Flutter version
        if: ${{ inputs.flutter_version != '' && inputs.flutter_version != 'stable' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: any
          cache: true

      - name: Validate and download project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          if [ -z "$ZIP_URL" ]; then echo "::error::zip_url kosong"; exit 1; fi
          curl --fail --location --show-error --retry 3 --retry-delay 3 --retry-all-errors --max-filesize 314572800 "$ZIP_URL" -o project.zip
          test -s project.zip
          unzip -tq project.zip

      - name: Extract project and locate pubspec.yaml
        run: |
          set -euo pipefail
          mkdir -p _proj
          unzip -q project.zip -d _proj
          PUB="$(find _proj -maxdepth 10 -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUB" ]; then
            echo "::error::ZIP tidak berisi pubspec.yaml. ZIP harus berisi proyek Flutter lengkap."
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"
          echo "Project directory: $(dirname "$PUB")"

      - name: Flutter pub get
        run: |
          set -euo pipefail
          cd "$PROJ_DIR"
          flutter --version
          flutter pub get

      - name: Flutter analyze
        if: ${{ inputs.build_mode == 'analyze' }}
        run: |
          set +e
          cd "$PROJ_DIR"
          mkdir -p "$GITHUB_WORKSPACE/output"
          flutter analyze > "$GITHUB_WORKSPACE/output/analysis-report.txt" 2>&1
          RESULT=$?
          {
            echo "Web2APK Flutter Analysis Report"
            echo "Flutter version: $(flutter --version | head -n 1)"
            echo "Exit code: $RESULT"
            echo "Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "=================================================="
            cat "$GITHUB_WORKSPACE/output/analysis-report.txt"
          } > "$GITHUB_WORKSPACE/output/report.tmp"
          mv "$GITHUB_WORKSPACE/output/report.tmp" "$GITHUB_WORKSPACE/output/analysis-report.txt"
          echo "Analyze finished; report will be uploaded even when findings exist."

      - name: Build release APK
        if: ${{ inputs.build_mode == 'release' }}
        run: |
          set -euo pipefail
          cd "$PROJ_DIR"
          flutter build apk --release

      - name: Build debug APK
        if: ${{ inputs.build_mode == 'debug' }}
        run: |
          set -euo pipefail
          cd "$PROJ_DIR"
          flutter build apk --debug

      - name: Prepare APK output
        if: ${{ inputs.build_mode == 'release' || inputs.build_mode == 'debug' }}
        env:
          APP_NAME: ${{ inputs.app_name }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          mkdir -p output
          SAFE_NAME="$(printf '%s' "$APP_NAME" | tr -cd '[:alnum:]_.-' | cut -c1-80)"
          [ -n "$SAFE_NAME" ] || SAFE_NAME="app"
          if [ "$BUILD_MODE" = "debug" ]; then
            SOURCE="$PROJ_DIR/build/app/outputs/flutter-apk/app-debug.apk"
            DEST="output/${SAFE_NAME}-debug.apk"
          else
            SOURCE="$PROJ_DIR/build/app/outputs/flutter-apk/app-release.apk"
            DEST="output/${SAFE_NAME}-release.apk"
          fi
          test -s "$SOURCE"
          cp "$SOURCE" "$DEST"
          ls -lh "$DEST"

      - name: Publish build output
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.user_id }}-${{ github.run_number }}
          name: "Web2APK ${{ inputs.build_mode }} - ${{ inputs.app_name }} #${{ github.run_number }}"
          body: "Generated by Web2APK Builder. Mode: ${{ inputs.build_mode }}"
          files: output/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temporary ZIP release
        if: ${{ always() && inputs.upload_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPLOAD_TAG: ${{ inputs.upload_tag }}
        shell: bash
        run: |
          set -u
          API="https://api.github.com/repos/$REPO"
          RELEASE_JSON="$(curl --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/$UPLOAD_TAG" || true)"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            curl --silent --show-error -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/$RELEASE_ID" || true
          fi
          curl --silent --show-error -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/git/refs/tags/$UPLOAD_TAG" || true
          
