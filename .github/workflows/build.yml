name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP"
        required: true
        type: string
      app_name:
        description: "Nama APK"
        required: true
        type: string
      user_id:
        description: "Telegram user ID"
        required: true
        type: string
      upload_tag:
        description: "Tag release upload sementara"
        required: false
        type: string
        default: ""
      build_mode:
        description: "Mode: release / debug / analyze"
        required: false
        type: string
        default: "release"

run-name: build-${{ inputs.user_id }}-${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # ═══════════════════════════════════════════════════════
      # 🔑 PRE-CACHE GRADLE 8.14 (bukan 8.14.0!)
      # Download sekali, taruh di cache Gradle wrapper
      # ═══════════════════════════════════════════════════════
      - name: Pre-cache Gradle 8.14
        shell: bash
        run: |
          set -uo pipefail

          python3 << 'PYEOF' || echo "⚠️ Pre-cache gagal, lanjut"
          import hashlib
          import os
          import urllib.request
          import zipfile

          # ⚠️ VERSI YANG BENAR: "8.14" (bukan "8.14.0")
          VERSION = "8.14"
          REAL_URL = f"https://services.gradle.org/distributions/gradle-{VERSION}-bin.zip"

          # Semua URL yang mungkin muncul di wrapper (termasuk yang buggy dari Flutter)
          CANDIDATE_URLS = [
              f"https://services.gradle.org/distributions/gradle-{VERSION}-bin.zip",
              f"https://github.com/gradle/gradle-distributions/releases/download/v{VERSION}/gradle-{VERSION}-bin.zip",
              f"https\\://services.gradle.org/distributions/gradle-{VERSION}-bin.zip",
              f"https\\://github.com/gradle/gradle-distributions/releases/download/v{VERSION}/gradle-{VERSION}-bin.zip",
          ]

          def to_base36(n):
              if n == 0: return '0'
              chars = '0123456789abcdefghijklmnopqrstuvwxyz'
              result = ''
              while n > 0:
                  result = chars[n % 36] + result
                  n //= 36
              return result

          def url_hash(url):
              md5_bytes = hashlib.md5(url.encode('utf-8')).digest()
              return to_base36(int.from_bytes(md5_bytes, 'big'))

          home = os.path.expanduser("~")
          dists_root = os.path.join(home, ".gradle", "wrapper", "dists", f"gradle-{VERSION}-bin")
          os.makedirs(dists_root, exist_ok=True)

          cache_dir = "/tmp/gradle-cache"
          os.makedirs(cache_dir, exist_ok=True)
          zip_path = os.path.join(cache_dir, f"gradle-{VERSION}-bin.zip")

          # Download sekali
          if not os.path.exists(zip_path) or os.path.getsize(zip_path) < 1000000:
              print(f"📥 Downloading Gradle {VERSION}...")
              print(f"   URL: {REAL_URL}")
              urllib.request.urlretrieve(REAL_URL, zip_path)
              print(f"✅ Downloaded {os.path.getsize(zip_path)} bytes")

          # Extract ke semua hash kemungkinan
          for url in CANDIDATE_URLS:
              h = url_hash(url)
              target = os.path.join(dists_root, h)
              extracted = os.path.join(target, f"gradle-{VERSION}")

              if os.path.isdir(extracted):
                  print(f"ℹ️  Already cached: {h}")
                  continue

              os.makedirs(target, exist_ok=True)
              print(f"📦 Caching for URL: {url[:70]}...")
              with zipfile.ZipFile(zip_path, 'r') as z:
                  z.extractall(target)

              # Marker file supaya Gradle skip download
              open(os.path.join(target, f"gradle-{VERSION}-bin.zip.ok"), 'w').close()
              print(f"✅ Cached: {h}")

          print("\n📂 Cache folder:")
          for d in sorted(os.listdir(dists_root)):
              print(f"   {d}")
          PYEOF

      - name: Download ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 3 --retry-all-errors \
              --connect-timeout 30 --max-filesize 314572800 \
              -o project.zip "$ZIP_URL"; then break; fi
            if [ "$i" -eq 5 ]; then exit 1; fi
            sleep 5
          done
          test -s project.zip
          unzip -tq project.zip
          ls -lh project.zip

      - name: Extract Project
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _proj
          unzip -q project.zip -d _proj
          PUB="$(find _proj -maxdepth 10 -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUB" ]; then
            echo "::error::ZIP tidak berisi pubspec.yaml."
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      # ═══════════════════════════════════════════════════════
      # 🔧 PATCH WRAPPER — VERSI 8.14 (2 DIGIT)
      # ═══════════════════════════════════════════════════════
      - name: Patch Gradle Config
        env:
          GRADLE_VERSION: "8.14"
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 << 'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJ_DIR"])
          version = os.environ["GRADLE_VERSION"]
          official_url = f"https\\://services.gradle.org/distributions/gradle-{version}-bin.zip"

          # 1. Patch semua wrapper
          wrappers = list(project.rglob("gradle-wrapper.properties"))
          for w in wrappers:
              content = w.read_text(encoding="utf-8")
              new_lines = []
              has_dist = False
              for line in content.splitlines():
                  if line.startswith("distributionUrl="):
                      has_dist = True
                      new_lines.append(f"distributionUrl={official_url}")
                  else:
                      new_lines.append(line)
              if not has_dist:
                  new_lines.append(f"distributionUrl={official_url}")
              w.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
              print(f"✅ Patched: {w.relative_to(project)}")

          # 2. Tambah gradle.properties untuk skip auto-upgrade
          props = project / "android" / "gradle.properties"
          extra = [
              "",
              "# CI Override",
              "android.skipBuildDependencyValidation=true",
              "android.newDsl=false",
              "org.gradle.daemon=false",
              "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G",
          ]

          if props.is_file():
              existing = props.read_text(encoding="utf-8")
              for key in ["android.skipBuildDependencyValidation", "android.newDsl"]:
                  existing = "\n".join(l for l in existing.splitlines() if not l.strip().startswith(key))
              props.write_text(existing + "\n" + "\n".join(extra) + "\n", encoding="utf-8")
              print("✅ Patched gradle.properties")
          else:
              props.parent.mkdir(parents=True, exist_ok=True)
              props.write_text("\n".join(extra) + "\n", encoding="utf-8")
              print("✅ Created gradle.properties")
          PY

      - name: Pub Get
        shell: bash
        run: |
          cd "$PROJ_DIR"
          flutter pub get

      # ═══════════════════════════════════════════════════════
      # 🔨 BUILD — Pakai flag skip validation
      # ═══════════════════════════════════════════════════════
      - name: Build APK
        env:
          MODE: ${{ inputs.build_mode || 'release' }}
          APP_NAME: ${{ inputs.app_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJ_DIR"
          MODE="${MODE:-release}"
          mkdir -p output

          if [ "$MODE" = "analyze" ]; then
            flutter analyze > analysis-report.txt 2>&1 || true
            cp analysis-report.txt "output/${APP_NAME}-analysis.txt"
          else
            flutter build apk --$MODE \
              --no-pub \
              --android-skip-build-dependency-validation

            APK="build/app/outputs/flutter-apk/app-${MODE}.apk"
            if [ ! -f "$APK" ]; then
              APK="$(find build/app/outputs -name "*.apk" -print -quit)"
            fi
            if [ -z "$APK" ] || [ ! -f "$APK" ]; then
              echo "::error::APK tidak ditemukan."
              exit 1
            fi
            cp "$APK" "output/${APP_NAME}.apk"
          fi

          ls -lh output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.user_id }}-${{ github.run_number }}
          name: "${{ inputs.app_name }} #${{ github.run_number }}"
          files: output/*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Cleanup
        if: ${{ always() && inputs.upload_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          UPLOAD_TAG: ${{ inputs.upload_tag }}
        shell: bash
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${REPOSITORY}/releases/tags/${UPLOAD_TAG}"
          R="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$API" || true)"
          C="$(printf '%s\n' "$R" | tail -n 1)"
          B="$(printf '%s\n' "$R" | sed '$d')"
          if [ "$C" = "200" ]; then
            ID="$(printf '%s' "$B" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')"
            if [ -n "$ID" ]; then
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPOSITORY}/releases/${ID}" || true
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPOSITORY}/git/refs/tags/${UPLOAD_TAG}" || true
            fi
          fi
          echo "Cleanup done."
