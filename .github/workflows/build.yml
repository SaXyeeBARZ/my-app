name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP"
        required: true
        type: string
      app_name:
        description: "Nama APK"
        required: true
        type: string
      user_id:
        description: "Telegram user ID"
        required: true
        type: string
      upload_tag:
        description: "Tag release upload sementara"
        required: false
        type: string
        default: ""
      build_mode:
        description: "Mode build: release / debug / analyze"
        required: false
        type: string
        default: "release"

run-name: build-${{ inputs.user_id }}-${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # ═══════════════════════════════════════════════════════════
      # 🔑 PRE-CACHE GRADLE 8.14.0
      # Flutter auto-upgrade akan pakai URL github.com/gradle/...
      # yang 404. Kita pre-cache di folder Gradle wrapper supaya
      # meskipun URL salah, Gradle pakai cache lokal.
      # ═══════════════════════════════════════════════════════════
      - name: Pre-cache Gradle 8.14.0
        shell: bash
        run: |
          set -uo pipefail

          python3 << 'PYEOF' || echo "⚠️ Pre-cache gagal, lanjut build"
          import hashlib
          import os
          import urllib.request
          import zipfile

          VERSION = "8.14.0"
          REAL_URL = f"https://services.gradle.org/distributions/gradle-{VERSION}-bin.zip"

          # Semua URL yang mungkin Flutter tulis di wrapper
          CANDIDATE_URLS = [
              f"https://github.com/gradle/gradle-distributions/releases/download/v{VERSION}/gradle-{VERSION}-bin.zip",
              f"https://services.gradle.org/distributions/gradle-{VERSION}-bin.zip",
          ]

          def to_base36(n):
              if n == 0: return '0'
              chars = '0123456789abcdefghijklmnopqrstuvwxyz'
              result = ''
              while n > 0:
                  result = chars[n % 36] + result
                  n //= 36
              return result

          def url_hash(url):
              md5_bytes = hashlib.md5(url.encode('utf-8')).digest()
              return to_base36(int.from_bytes(md5_bytes, 'big'))

          home = os.path.expanduser("~")
          dists_root = os.path.join(home, ".gradle", "wrapper", "dists", f"gradle-{VERSION}-bin")
          os.makedirs(dists_root, exist_ok=True)

          cache_dir = "/tmp/gradle-cache"
          os.makedirs(cache_dir, exist_ok=True)
          zip_path = os.path.join(cache_dir, f"gradle-{VERSION}-bin.zip")

          if not os.path.exists(zip_path) or os.path.getsize(zip_path) < 1000000:
              print(f"📥 Downloading Gradle {VERSION}...")
              urllib.request.urlretrieve(REAL_URL, zip_path)
              print(f"✅ Downloaded {os.path.getsize(zip_path)} bytes")

          for url in CANDIDATE_URLS:
              h = url_hash(url)
              target = os.path.join(dists_root, h)
              extracted = os.path.join(target, f"gradle-{VERSION}")

              if os.path.isdir(extracted):
                  print(f"ℹ️  Already cached: {h}")
                  continue

              os.makedirs(target, exist_ok=True)
              print(f"📦 Caching for URL: {url[:70]}...")
              with zipfile.ZipFile(zip_path, 'r') as z:
                  z.extractall(target)

              open(os.path.join(target, f"gradle-{VERSION}-bin.zip.ok"), 'w').close()
              open(os.path.join(target, f"gradle-{VERSION}-bin.zip.lck"), 'w').close()
              print(f"✅ Cached: {h}")

          print("\n📂 Cache folder:")
          for d in sorted(os.listdir(dists_root)):
              print(f"   {d}")
          PYEOF

      - name: Download ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "$ZIP_URL" ]; then
            echo "::error::zip_url kosong"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if curl -fL \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-filesize 314572800 \
              -o project.zip "$ZIP_URL"; then
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "::error::Gagal mengunduh ZIP."
              exit 1
            fi
            sleep 5
          done

          test -s project.zip
          unzip -tq project.zip
          ls -lh project.zip

      - name: Extract Project
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p _proj
          unzip -q project.zip -d _proj

          PUB="$(find _proj -maxdepth 10 -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUB" ]; then
            echo "::error::ZIP tidak berisi pubspec.yaml."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUB")"
          echo "PROJ_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Patch Gradle Wrapper
        env:
          GRADLE_VERSION: "8.14.0"
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 << 'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJ_DIR"])
          version = os.environ["GRADLE_VERSION"]
          official_url = f"https\\://services.gradle.org/distributions/gradle-{version}-bin.zip"

          wrappers = list(project.rglob("gradle-wrapper.properties"))
          if not wrappers:
              print("⚠️  Tidak ada gradle-wrapper.properties")
              raise SystemExit(0)

          print(f"📋 Ditemukan {len(wrappers)} file:")
          for w in wrappers:
              print(f"   - {w.relative_to(project)}")

          for wrapper in wrappers:
              content = wrapper.read_text(encoding="utf-8")
              lines = content.splitlines()
              changed = False
              new_lines = []
              has_distribution = False

              for line in lines:
                  if line.startswith("distributionUrl="):
                      has_distribution = True
                      new_lines.append(f"distributionUrl={official_url}")
                      if line != f"distributionUrl={official_url}":
                          changed = True
                  else:
                      new_lines.append(line)

              if not has_distribution:
                  new_lines.append(f"distributionUrl={official_url}")
                  changed = True

              if changed:
                  wrapper.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
                  print(f"✅ Patched: {wrapper.relative_to(project)}")

          PY

      - name: Pub Get
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJ_DIR"
          flutter pub get

      - name: Build APK
        env:
          MODE: ${{ inputs.build_mode || 'release' }}
          APP_NAME: ${{ inputs.app_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJ_DIR"

          # ═══════════════════════════════════════════════════════
          # RE-PATCH SEBELUM BUILD (Flutter auto-upgrade bisa
          # menimpa wrapper di sini, jadi kita patch terakhir kali)
          # ═══════════════════════════════════════════════════════
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'GRADLE_EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          GRADLE_EOF

          # Hapus leading whitespace dari heredoc
          sed -i 's/^[[:space:]]*//' android/gradle/wrapper/gradle-wrapper.properties

          echo "📄 Wrapper sebelum build:"
          cat android/gradle/wrapper/gradle-wrapper.properties

          MODE="${MODE:-release}"
          echo "🎯 Mode: $MODE"

          mkdir -p output

          if [ "$MODE" = "analyze" ]; then
            flutter analyze > analysis-report.txt 2>&1 || true
            cp analysis-report.txt "output/${APP_NAME}-analysis.txt"
          else
            flutter build apk --$MODE --no-pub

            APK="build/app/outputs/flutter-apk/app-${MODE}.apk"
            if [ ! -f "$APK" ]; then
              APK="$(find build/app/outputs -name "*.apk" -print -quit)"
            fi

            if [ -z "$APK" ] || [ ! -f "$APK" ]; then
              echo "::error::File APK tidak ditemukan."
              exit 1
            fi

            cp "$APK" "output/${APP_NAME}.apk"
          fi

          ls -lh output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.user_id }}-${{ github.run_number }}
          name: "${{ inputs.app_name }} #${{ github.run_number }}"
          files: output/*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Cleanup Upload Release
        if: ${{ always() && inputs.upload_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          UPLOAD_TAG: ${{ inputs.upload_tag }}
        shell: bash
        run: |
          set -uo pipefail

          API="https://api.github.com/repos/${REPOSITORY}/releases/tags/${UPLOAD_TAG}"
          RESPONSE="$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API" || true)"

          HTTP_CODE="$(printf '%s\n' "$RESPONSE" | tail -n 1)"
          BODY="$(printf '%s\n' "$RESPONSE" | sed '$d')"

          if [ "$HTTP_CODE" = "200" ]; then
            RELEASE_ID="$(printf '%s' "$BODY" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("id", ""))')"

            if [ -n "$RELEASE_ID" ]; then
              curl -sS -o /dev/null -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}" || true

              curl -sS -o /dev/null -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/git/refs/tags/${UPLOAD_TAG}" || true
            fi
          fi

          echo "Cleanup selesai."
