name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP"
        required: true
        type: string
      app_name:
        description: "Nama APK"
        required: true
        type: string
      user_id:
        description: "Telegram user ID"
        required: true
        type: string
      upload_tag:
        description: "Tag release upload sementara"
        required: false
        type: string
        default: ""
      build_mode:
        description: "Mode build: release / debug / analyze"
        required: false
        type: string
        default: "release"

run-name: build-${{ inputs.user_id }}-${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ═══════════════════════════════════════════════════════════
      # 🔑 Flutter 3.35.0 — Dart 3.9.0 (support project modern)
      # ═══════════════════════════════════════════════════════════
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Download ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "$ZIP_URL" ]; then
            echo "::error::zip_url kosong"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if curl -fL \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-filesize 314572800 \
              -o project.zip "$ZIP_URL"; then
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "::error::Gagal mengunduh ZIP setelah 5 percobaan."
              exit 1
            fi

            sleep 5
          done

          test -s project.zip
          unzip -tq project.zip
          ls -lh project.zip

      - name: Extract Project
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p _proj
          unzip -q project.zip -d _proj

          PUB="$(find _proj -maxdepth 10 -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUB" ]; then
            echo "::error::ZIP tidak berisi pubspec.yaml."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUB")"
          echo "PROJ_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      # ═══════════════════════════════════════════════════════════
      # 🔧 PATCH SEMUA gradle-wrapper.properties
      # - Force URL resmi: https://services.gradle.org/...
      # - Force versi: 8.14.0
      # - Handle file di manapun di project
      # ═══════════════════════════════════════════════════════════
      - name: Patch Gradle Wrapper (CI Only)
        env:
          GRADLE_VERSION: "8.14.0"
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJ_DIR"])
          version = os.environ["GRADLE_VERSION"]
          official_url = f"https\\://services.gradle.org/distributions/gradle-{version}-bin.zip"

          # Cari SEMUA gradle-wrapper.properties di project
          wrappers = list(project.rglob("gradle-wrapper.properties"))

          if not wrappers:
              print("⚠️  Tidak ada gradle-wrapper.properties; skip patch.")
              raise SystemExit(0)

          print(f"📋 Ditemukan {len(wrappers)} file gradle-wrapper.properties:")
          for w in wrappers:
              print(f"   - {w.relative_to(project)}")
          print()

          for wrapper in wrappers:
              try:
                  content = wrapper.read_text(encoding="utf-8")
              except Exception as e:
                  print(f"⚠️  Gagal baca {wrapper}: {e}")
                  continue

              lines = content.splitlines()
              changed = False
              new_lines = []
              has_distribution = False

              for line in lines:
                  if line.startswith("distributionUrl="):
                      has_distribution = True
                      new_lines.append(f"distributionUrl={official_url}")
                      if line != f"distributionUrl={official_url}":
                          changed = True
                          print(f"🔧 Patch: {wrapper.relative_to(project)}")
                          print(f"   OLD: {line}")
                          print(f"   NEW: distributionUrl={official_url}")
                  else:
                      new_lines.append(line)

              # Kalau belum ada distributionUrl sama sekali
              if not has_distribution:
                  new_lines.append(f"distributionUrl={official_url}")
                  changed = True
                  print(f"➕ Tambah distributionUrl di {wrapper.relative_to(project)}")

              if changed:
                  wrapper.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
                  print(f"✅ Tersimpan: {wrapper.relative_to(project)}")
              else:
                  print(f"ℹ️  Sudah benar: {wrapper.relative_to(project)}")

          print("\n📄 Verifikasi isi wrapper pertama:")
          first = wrappers[0]
          print(f"File: {first.relative_to(project)}")
          for line in first.read_text(encoding="utf-8").splitlines():
              if "distributionUrl" in line:
                  print(f"  → {line}")
          PY

      - name: Flutter Version Check
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter --version
          cd "$PROJ_DIR"
          flutter doctor -v

      - name: Pub Get
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJ_DIR"
          flutter pub get

      - name: Build (Release / Debug / Analyze)
        env:
          MODE: ${{ inputs.build_mode || 'release' }}
          APP_NAME: ${{ inputs.app_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJ_DIR"
          MODE="${MODE:-release}"
          echo "🎯 Mode: $MODE"

          mkdir -p output

          if [ "$MODE" = "analyze" ]; then
            echo "🔎 Menjalankan flutter analyze..."
            flutter analyze > analysis-report.txt 2>&1 || true
            cp analysis-report.txt "output/${APP_NAME}-analysis.txt"
          else
            echo "🔨 Building APK mode: $MODE"
            flutter build apk --$MODE

            APK="build/app/outputs/flutter-apk/app-${MODE}.apk"

            if [ ! -f "$APK" ]; then
              APK="$(find build/app/outputs -name "*.apk" -print -quit)"
            fi

            if [ -z "$APK" ] || [ ! -f "$APK" ]; then
              echo "::error::File APK tidak ditemukan setelah build."
              exit 1
            fi

            cp "$APK" "output/${APP_NAME}.apk"
          fi

          echo "📦 Output:"
          ls -lh output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.user_id }}-${{ github.run_number }}
          name: "${{ inputs.app_name }} #${{ github.run_number }}"
          files: output/*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Cleanup Upload Release
        if: ${{ always() && inputs.upload_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          UPLOAD_TAG: ${{ inputs.upload_tag }}
        shell: bash
        run: |
          set -uo pipefail

          API="https://api.github.com/repos/${REPOSITORY}/releases/tags/${UPLOAD_TAG}"

          RESPONSE="$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API" || true)"

          HTTP_CODE="$(printf '%s\n' "$RESPONSE" | tail -n 1)"
          BODY="$(printf '%s\n' "$RESPONSE" | sed '$d')"

          if [ "$HTTP_CODE" = "200" ]; then
            RELEASE_ID="$(
              printf '%s' "$BODY" |
                python3 -c \
                'import json,sys; print(json.load(sys.stdin).get("id", ""))'
            )"

            if [ -n "$RELEASE_ID" ]; then
              curl -sS -o /dev/null -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}" \
                || true

              curl -sS -o /dev/null -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/git/refs/tags/${UPLOAD_TAG}" \
                || true
            fi
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "Release sementara tidak ditemukan; cleanup dilewati."
          else
            echo "::warning::Cleanup gagal. HTTP ${HTTP_CODE}"
          fi

          echo "Cleanup selesai."
