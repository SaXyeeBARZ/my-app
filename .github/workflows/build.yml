name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url: { required: true, type: string }
      app_name: { required: true, type: string }
      user_id: { required: true, type: string }
      upload_tag: { required: false, type: string, default: "" }
      build_mode: { required: false, type: string, default: "release" }

run-name: build-${{ inputs.user_id }}-${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Pre-cache Gradle 8.14
        shell: bash
        run: |
          set -uo pipefail
          python3 << 'PYEOF' || echo "⚠️ Pre-cache gagal, lanjut"
          import hashlib, os, urllib.request, zipfile
          VERSION = "8.14"
          REAL_URL = f"https://services.gradle.org/distributions/gradle-{VERSION}-bin.zip"
          CANDIDATE_URLS = [
              f"https://services.gradle.org/distributions/gradle-{VERSION}-bin.zip",
              f"https://github.com/gradle/gradle-distributions/releases/download/v{VERSION}/gradle-{VERSION}-bin.zip",
              f"https\\://services.gradle.org/distributions/gradle-{VERSION}-bin.zip",
              f"https\\://github.com/gradle/gradle-distributions/releases/download/v{VERSION}/gradle-{VERSION}-bin.zip",
          ]
          def to_base36(n):
              if n == 0: return '0'
              chars = '0123456789abcdefghijklmnopqrstuvwxyz'
              r = ''
              while n > 0:
                  r = chars[n % 36] + r
                  n //= 36
              return r
          def url_hash(url):
              return to_base36(int.from_bytes(hashlib.md5(url.encode('utf-8')).digest(), 'big'))
          home = os.path.expanduser("~")
          dists_root = os.path.join(home, ".gradle", "wrapper", "dists", f"gradle-{VERSION}-bin")
          os.makedirs(dists_root, exist_ok=True)
          cache_dir = "/tmp/gradle-cache"
          os.makedirs(cache_dir, exist_ok=True)
          zip_path = os.path.join(cache_dir, f"gradle-{VERSION}-bin.zip")
          if not os.path.exists(zip_path) or os.path.getsize(zip_path) < 1000000:
              print(f"📥 Downloading Gradle {VERSION}...")
              urllib.request.urlretrieve(REAL_URL, zip_path)
          for url in CANDIDATE_URLS:
              h = url_hash(url)
              target = os.path.join(dists_root, h)
              extracted = os.path.join(target, f"gradle-{VERSION}")
              if os.path.isdir(extracted):
                  continue
              os.makedirs(target, exist_ok=True)
              with zipfile.ZipFile(zip_path, 'r') as z:
                  z.extractall(target)
              open(os.path.join(target, f"gradle-{VERSION}-bin.zip.ok"), 'w').close()
              print(f"✅ Cached: {h}")
          PYEOF

      - name: Download ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 3 --retry-all-errors \
              --connect-timeout 30 --max-filesize 314572800 \
              -o project.zip "$ZIP_URL"; then break; fi
            if [ "$i" -eq 5 ]; then exit 1; fi
            sleep 5
          done
          test -s project.zip
          unzip -tq project.zip

      - name: Extract Project
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _proj
          unzip -q project.zip -d _proj
          PUB="$(find _proj -maxdepth 10 -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUB" ]; then
            echo "::error::ZIP tidak berisi pubspec.yaml."
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      # ═══════════════════════════════════════════════════════
      # 🔧 FIX #1: PATCH WRAPPER + GRADLE.PROPERTIES
      # ═══════════════════════════════════════════════════════
      - name: Patch Gradle Config
        env:
          GRADLE_VERSION: "8.14"
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 << 'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJ_DIR"])
          version = os.environ["GRADLE_VERSION"]
          official_url = f"https\\://services.gradle.org/distributions/gradle-{version}-bin.zip"
          for w in project.rglob("gradle-wrapper.properties"):
              content = w.read_text(encoding="utf-8")
              new_lines = []
              has_dist = False
              for line in content.splitlines():
                  if line.startswith("distributionUrl="):
                      has_dist = True
                      new_lines.append(f"distributionUrl={official_url}")
                  else:
                      new_lines.append(line)
              if not has_dist:
                  new_lines.append(f"distributionUrl={official_url}")
              w.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          props = project / "android" / "gradle.properties"
          extra = ["", "# CI Override",
                   "android.skipBuildDependencyValidation=true",
                   "android.newDsl=false",
                   "org.gradle.daemon=false"]
          if props.is_file():
              existing = props.read_text(encoding="utf-8")
              for key in ["android.skipBuildDependencyValidation", "android.newDsl"]:
                  existing = "\n".join(l for l in existing.splitlines() if not l.strip().startswith(key))
              props.write_text(existing + "\n" + "\n".join(extra) + "\n", encoding="utf-8")
          else:
              props.parent.mkdir(parents=True, exist_ok=True)
              props.write_text("\n".join(extra) + "\n", encoding="utf-8")
          print("✅ Patched wrapper + gradle.properties")
          PY

      # ═══════════════════════════════════════════════════════
      # 🔧 FIX #2: BACKUP FILE KOTLIN USER
      # Simpan versi user (Kotlin) sebelum Flutter overwrite
      # ═══════════════════════════════════════════════════════
      - name: Backup Kotlin Files
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/kts_backup
          cd "$PROJ_DIR"

          # Backup semua build.gradle.kts
          find . -name "build.gradle.kts" -not -path "*/build/*" | while read f; do
            rel="${f#./}"
            safe=$(echo "$rel" | tr '/' '_')
            cp "$f" "/tmp/kts_backup/$safe"
            echo "💾 Backed up: $rel → $safe"
          done

          ls -la /tmp/kts_backup/

      # ═══════════════════════════════════════════════════════
      # 🔧 FIX #3: FIX GROOVY-IN-KOTLIN (safety net)
      # ═══════════════════════════════════════════════════════
      - name: Fix Groovy-in-Kotlin Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 << 'PYEOF'
          import os, re
          from pathlib import Path
          project = Path(os.environ["PROJ_DIR"])
          kts_files = list(project.rglob("build.gradle.kts"))
          PATTERNS = [
              (re.compile(r'\bminSdkVersion\s+(?!\()([^\s\r\n=]+)'), r'minSdk = \1', 'minSdkVersion'),
              (re.compile(r'\btargetSdkVersion\s+(?!\()([^\s\r\n=]+)'), r'targetSdk = \1', 'targetSdkVersion'),
              (re.compile(r'\bcompileSdkVersion\s+(?!\()([^\s\r\n=]+)'), r'compileSdk = \1', 'compileSdkVersion'),
              (re.compile(r'\bversionCode\s+(?!\()([^\s\r\n=]+)'), r'versionCode = \1', 'versionCode'),
              (re.compile(r'\bversionName\s+(?!\()("[^"]*")'), r'versionName = \1', 'versionName'),
              (re.compile(r'\bminSdkVersion\s*=\s*([^\s\r\n]+)'), r'minSdk = \1', 'minSdkVersion-eq'),
              (re.compile(r'\btargetSdkVersion\s*=\s*([^\s\r\n]+)'), r'targetSdk = \1', 'targetSdkVersion-eq'),
              (re.compile(r'\bcompileSdkVersion\s*=\s*([^\s\r\n]+)'), r'compileSdk = \1', 'compileSdkVersion-eq'),
          ]
          for f in kts_files:
              original = f.read_text(encoding="utf-8")
              content = original
              for pat, repl, name in PATTERNS:
                  content = pat.sub(repl, content)
              if content != original:
                  f.write_text(content, encoding="utf-8")
                  print(f"🔧 Fixed: {f.relative_to(project)}")
          print("✅ Groovy→Kotlin fix selesai")
          PYEOF

      - name: Pub Get
        shell: bash
        run: |
          cd "$PROJ_DIR"
          flutter pub get

      # ═══════════════════════════════════════════════════════
      # 🔧 FIX #4: TRIGGER MIGRATE + RESTORE
      # Flutter 3.35 migrate file .kts jadi Groovy (BUG).
      # Kita trigger dulu, terus restore file Kotlin user.
      # ═══════════════════════════════════════════════════════
      - name: Pre-Build Migrate + Restore
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJ_DIR"

          echo "🎬 Trigger Flutter migrate (config-only)..."
          flutter build apk --config-only --no-pub 2>&1 || true

          echo ""
          echo "🔄 Cek file yang diubah Flutter:"
          find . -name "build.gradle.kts" -not -path "*/build/*" | while read f; do
            rel="${f#./}"
            safe=$(echo "$rel" | tr '/' '_')
            if [ -f "/tmp/kts_backup/$safe" ]; then
              if ! cmp -s "$f" "/tmp/kts_backup/$safe"; then
                echo "   ⚠️  $rel berubah → restore dari backup"
                cp "/tmp/kts_backup/$safe" "$f"
              else
                echo "   ✅ $rel tidak berubah"
              fi
            fi
          done

          echo ""
          echo "📄 Verify file user (Kotlin):"
          head -50 android/app/build.gradle.kts | tail -20

      # ═══════════════════════════════════════════════════════
      # 🔨 BUILD APK
      # ═══════════════════════════════════════════════════════
      - name: Build APK
        env:
          MODE: ${{ inputs.build_mode || 'release' }}
          APP_NAME: ${{ inputs.app_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJ_DIR"
          MODE="${MODE:-release}"
          mkdir -p output

          if [ "$MODE" = "analyze" ]; then
            flutter analyze > analysis-report.txt 2>&1 || true
            cp analysis-report.txt "output/${APP_NAME}-analysis.txt"
          else
            flutter build apk --$MODE --no-pub \
              --android-skip-build-dependency-validation

            APK="build/app/outputs/flutter-apk/app-${MODE}.apk"
            if [ ! -f "$APK" ]; then
              APK="$(find build/app/outputs -name "*.apk" -print -quit)"
            fi
            if [ -z "$APK" ] || [ ! -f "$APK" ]; then
              echo "::error::APK tidak ditemukan."
              exit 1
            fi
            cp "$APK" "output/${APP_NAME}.apk"
          fi
          ls -lh output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.user_id }}-${{ github.run_number }}
          name: "${{ inputs.app_name }} #${{ github.run_number }}"
          files: output/*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Cleanup
        if: ${{ always() && inputs.upload_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          UPLOAD_TAG: ${{ inputs.upload_tag }}
        shell: bash
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${REPOSITORY}/releases/tags/${UPLOAD_TAG}"
          R="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$API" || true)"
          C="$(printf '%s\n' "$R" | tail -n 1)"
          B="$(printf '%s\n' "$R" | sed '$d')"
          if [ "$C" = "200" ]; then
            ID="$(printf '%s' "$B" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')"
            if [ -n "$ID" ]; then
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPOSITORY}/releases/${ID}" || true
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPOSITORY}/git/refs/tags/${UPLOAD_TAG}" || true
            fi
          fi
          echo "Cleanup done."
