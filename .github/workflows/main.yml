name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url: { required: true }
      app_name: { required: true }
      user_id: { required: true }
      upload_tag: { required: false }

run-name: build-${{ inputs.user_id }}-${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Download ZIP
        run: |
          for i in 1 2 3 4 5; do
            curl -L -C - --retry 5 --retry-delay 5 --retry-all-errors \
              -o project.zip "${{ inputs.zip_url }}" && break || sleep 5
          done
          ls -lah project.zip

      - name: Extract
        run: |
          mkdir -p _proj
          unzip -q project.zip -d _proj
          PUB=$(find _proj -maxdepth 4 -name pubspec.yaml | head -n1)
          [ -z "$PUB" ] && exit 1
          echo "PROJ_DIR=$(dirname "$PUB")" >> $GITHUB_ENV

      - name: Pub get
        run: cd "$PROJ_DIR" && flutter pub get

      - name: Build APK
        run: cd "$PROJ_DIR" && flutter build apk --release

      - name: Prepare
        run: |
          mkdir -p output
          cp "$PROJ_DIR/build/app/outputs/flutter-apk/app-release.apk" \
             "output/${{ inputs.app_name }}.apk"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.user_id }}-${{ github.run_number }}
          name: "${{ inputs.app_name }} #${{ github.run_number }}"
          files: output/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always() && inputs.upload_tag != ''
        run: |
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.upload_tag }}" || true
